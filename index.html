<!DOCTYPE html>

<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon & PWA Manifest -->
  <link rel="icon" type="image/png" href="./assets/favicon.ico" />
  <link rel="manifest" href="./manifest.json" />

  <!-- Meta básica & PWA Mobile -->
  <meta name="theme-color" content="#0052ff" />
  <meta name="description" content="Aplicativo imersivo para gestão de aniversários e celebrações." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Leão Festivo" />

  <title>Leão Festivo • Gestão de Aniversários</title>

  <!-- Estilos inline do Splash Screen Inicial para 0ms de FOUC -->
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0052FF;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    #initial-splash-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #0052FF 0%, #0036b3 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      z-index: 99999;
      text-align: center;
      padding: 20px;
    }
    .splash-spinner {
      width: 46px;
      height: 46px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #FFCC00;
      border-radius: 50%;
      animation: spinSplash 0.8s linear infinite;
      margin-bottom: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    @keyframes spinSplash {
      to { transform: rotate(360deg); }
    }
    .splash-title {
      font-size: 2rem;
      font-weight: 900;
      margin: 0 0 6px 0;
      letter-spacing: -1px;
    }
    .splash-sub {
      font-size: 0.95rem;
      opacity: 0.85;
      margin: 0;
    }
  </style>
</head>

<body>
  <!-- Tela Splash de carregamento rápido enquanto o JavaScript inicializa -->
  <div id="initial-splash-loader">
    <div class="splash-spinner"></div>
    <div class="splash-title">Leão Festivo</div>
    <div class="splash-sub">Carregando celebrações...</div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
