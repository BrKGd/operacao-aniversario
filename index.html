  <!-- Control de Cache Rígido para forçar index.html atualizado no navegador -->

  <title>Leão Festivo • Gestão de Aniversários</title>

  <!-- Auto-recuperação de cache antigo do PWA para erros de Module Script -->
  <script>
    window.addEventListener('error', function(e) {
      var msg = (e && e.message) || '';
      var src = (e && e.filename) || '';
      if (msg.indexOf('Expected a JavaScript') !== -1 || msg.indexOf('Failed to load module script') !== -1 || msg.indexOf('MIME type') !== -1) {
        console.warn('[PWA] Cache antigo detectado. Limpando registrador e recarregando...');
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) regs[i].unregister();
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (var j = 0; j < names.length; j++) caches.delete(names[j]);
                window.location.reload(true);
              });
            } else {
              window.location.reload(true);
            }
          });
        } else {
          window.location.reload(true);
        }
      }
    }, true);
  </script>

  <!-- Estilos inline do Splash Screen Inicial para 0ms de FOUC -->
  <style>

      border-radius: 50%;
      animation: spinSplash 0.8s linear infinite;
      margin-bottom: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    @keyframes spinSplash {
      to { transform: rotate(360deg); }
    }
    .splash-title {
      font-size: 2rem;
      font-weight: 900;
      margin: 0 0 6px 0;

  </style>
