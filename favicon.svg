<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Dark Obsidian Titanium -->
    <linearGradient id="titaniumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Regal Gold Gradients -->
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FCD34D"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Metallic Edge Ring -->
    <linearGradient id="metalRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#475569" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadowLion" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Titanium Squircle Container -->
  <rect width="512" height="512" rx="112" fill="url(#titaniumBg)"/>

  <!-- Metallic Gold Edge Ring -->
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="url(#metalRing)" stroke-width="3.5"/>

  <!-- Background Shield Pattern (Subtle geometry) -->
  <path d="M 256 50 L 390 100 L 390 260 C 390 350, 256 440, 256 440 C 256 440, 122 350, 122 260 L 122 100 Z" 
        fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Main Lion Group -->
  <g filter="url(#shadowLion)">

    <!-- CROWN (Top King Crown) -->
    <g filter="url(#goldGlow)">
      <!-- Crown Base -->
      <path d="M 180 125 L 332 125 L 342 80 L 296 100 L 256 60 L 216 100 L 170 80 Z" fill="url(#goldBright)"/>
      <rect x="180" y="122" width="152" height="12" rx="3" fill="url(#goldDark)"/>
      <!-- Crown Jewels -->
      <circle cx="256" cy="60" r="7" fill="#38BDF8"/>
      <circle cx="170" cy="80" r="5" fill="#38BDF8"/>
      <circle cx="342" cy="80" r="5" fill="#38BDF8"/>
      <circle cx="256" cy="128" r="4" fill="#FFFFFF"/>
      <circle cx="216" cy="128" r="4" fill="#FFFFFF"/>
      <circle cx="296" cy="128" r="4" fill="#FFFFFF"/>
    </g>

    <!-- LION MANE (Bold Geometric Polygon Shapes) -->
    <!-- Left Mane -->
    <polygon points="130,160 175,150 150,210 115,220" fill="url(#goldDark)"/>
    <polygon points="115,220 150,210 140,280 95,270" fill="url(#goldBright)"/>
    <polygon points="95,270 140,280 155,340 110,350" fill="url(#goldDark)"/>
    <polygon points="110,350 155,340 185,400 145,410" fill="url(#goldBright)"/>
    
    <!-- Right Mane -->
    <polygon points="382,160 337,150 362,210 397,220" fill="url(#goldBright)"/>
    <polygon points="397,220 362,210 372,280 417,270" fill="url(#goldDark)"/>
    <polygon points="417,270 372,280 357,340 402,350" fill="url(#goldBright)"/>
    <polygon points="402,350 357,340 327,400 367,410" fill="url(#goldDark)"/>

    <!-- Bottom Mane / Chin Flare -->
    <polygon points="185,400 256,450 327,400 256,415" fill="url(#goldBright)"/>

    <!-- LION FACE STRUCTURE -->
    <!-- Forehead & Nose Bridge Base -->
    <polygon points="175,150 337,150 310,230 202,230" fill="url(#goldBright)"/>
    
    <!-- Center Forehead Shading -->
    <polygon points="216,150 296,150 276,210 236,210" fill="url(#goldDark)"/>

    <!-- Cheek Left -->
    <polygon points="175,150 202,230 160,290 140,280" fill="url(#goldBright)"/>

    <!-- Cheek Right -->
    <polygon points="337,150 310,230 352,290 372,280" fill="url(#goldDark)"/>

    <!-- Eyes (Piercing Blue Glowing Eyes) -->
    <polygon points="195,225 230,232 205,242" fill="#0284C7"/>
    <polygon points="198,227 225,232 207,240" fill="#38BDF8"/>
    <circle cx="212" cy="233" r="2.5" fill="#FFFFFF"/>

    <polygon points="317,225 282,232 307,242" fill="#0284C7"/>
    <polygon points="314,227 287,232 305,240" fill="#38BDF8"/>
    <circle cx="300" cy="233" r="2.5" fill="#FFFFFF"/>

    <!-- Snout & Muzzle Center -->
    <polygon points="202,230 310,230 286,330 226,330" fill="url(#goldBright)"/>

    <!-- Nose Triangle -->
    <polygon points="234,300 278,300 256,325" fill="#0F172A"/>

    <!-- Jaw & Chin (Strong Square Jaw) -->
    <polygon points="226,330 286,330 270,390 242,390" fill="url(#goldDark)"/>

  </g>

  <!-- Sharp Geometric Stars Accent -->
  <path d="M 256 16 L 260 26 L 270 30 L 260 34 L 256 44 L 252 34 L 242 30 L 252 26 Z" fill="#FCD34D"/>
</svg>